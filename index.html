<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1015" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Mazzi, combo e allenamento per Yu-Gi-Oh!" />
    <script>
      // Imposta tema e lingua prima del primo disegno (nessun lampo di tema sbagliato).
      try {
        var p = localStorage.getItem('combolab.theme');
        var t = p === 'dark' || p === 'light' ? p : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var d = document.documentElement;
        d.dataset.theme = t;
        d.style.colorScheme = t;
        var l = localStorage.getItem('combolab.lang');
        if (l !== 'it' && l !== 'en') l = (navigator.language || 'en').toLowerCase().indexOf('it') === 0 ? 'it' : 'en';
        d.lang = l;
      } catch (e) {}
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Combo Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
